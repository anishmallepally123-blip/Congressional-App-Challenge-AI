# Builds LoAI.zip and publishes it as a GitHub Release, either when a version tag
# (v1.0.0, ...) is pushed or when started by hand from the Actions tab with a version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, like v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build LoAI.zip
        run: |
          mkdir -p "build/LoAI"
          cp -r chatbot organizer connectors launcher README.md "QUICK START.txt" \
            "Start LoAI - Windows.bat" "Start LoAI - Mac.command" "build/LoAI/"
          chmod +x "build/LoAI/Start LoAI - Mac.command" "build/LoAI/chatbot/start-mac.command"
          find build -name __pycache__ -prune -exec rm -rf {} +
          cd build && zip -qr -X ../LoAI.zip "LoAI"
          unzip -l ../LoAI.zip | tail -1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" LoAI.zip \
            --target "$GITHUB_SHA" \
            --title "LoAI $VERSION" \
            --notes "Download **LoAI.zip**, unzip it, and double-click the Start file for Windows or Mac. The first run downloads Python and Ollama by itself. Full steps: [QUICK START.txt](https://github.com/${{ github.repository }}/blob/$VERSION/QUICK%20START.txt)."
